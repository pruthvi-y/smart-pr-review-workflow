[project]
name = "smart-pr-review-workflow"
version = "0.8.0"
description = "Beginner-friendly LangGraph PR review workflow using Amazon Bedrock, local RAG, GitHub, and MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-aws>=1.2,<2",
    "langchain-chroma>=0.2,<1",
    "langchain-text-splitters>=0.3,<1",
    "langgraph>=1.2,<2",
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[project.scripts]
run-pr-review = "smart_pr_review_workflow.main:main"
index-knowledge = "smart_pr_review_workflow.index_knowledge:main"
mcp-server = "smart_pr_review_workflow.mcp.server:main"
inspect-mcp = "smart_pr_review_workflow.mcp.demo:main"
